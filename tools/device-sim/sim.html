<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>设备模拟器</title>
<style>
:root{color-scheme:dark;--bg:#111318;--fg:#e8eaf0;--muted:#8b90a0;--card:#1b1e26;--accent:#6aa6ff}
*{box-sizing:border-box}
body{margin:0;user-select:none;-webkit-user-select:none;padding:16px;background:var(--bg);color:var(--fg);font:14px/1.6 system-ui,"PingFang SC","Microsoft YaHei",sans-serif}
h1{font-size:18px;margin:0 0 4px}
p{margin:0 0 12px;color:var(--muted);max-width:760px}
.device{display:inline-flex;gap:14px;align-items:center;padding:18px 22px;border-radius:24px;background:#2a2d36;max-width:100%}
canvas{display:block;user-select:none;-webkit-user-select:none;width:min(720px,calc(100vw - 150px));aspect-ratio:3/2;background:#000;border-radius:4px;cursor:pointer;touch-action:none}
.boot{width:44px;height:44px;border-radius:50%;border:0;background:#3a3e4a;color:var(--fg);font:12px system-ui;cursor:pointer;flex:none}
.boot:active{background:#4a5060}
kbd{background:var(--card);border:1px solid #2c3040;border-radius:4px;padding:0 5px}
#stats{margin-top:10px;color:var(--muted);font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<h1>设备模拟器 · 480×320</h1>
<p>运行的是固件里同一份界面代码（nomi_ui.c、face.c，LVGL 9.5，小智的中文字体），鼠标当触摸。
左右滑切换 Nomi / 视觉模式，从顶部往下拉打开设置、往上推收起。
说话用右边圆钮或 <kbd>空格</kbd>（BOOT 键，默认按住说话）。按 <kbd>Z</kbd> 立刻睡着，点屏幕唤醒。
对话内容和视觉模式的取景画面都是模拟的，真正的摄像头和 API 只在设备上。</p>
<div class="device">
  <canvas id="lcd" width="480" height="320"></canvas>
  <button class="boot" id="boot" title="BOOT 键">BOOT</button>
</div>
<div id="stats"></div>
<script>
(async()=>{
  const stats=document.getElementById('stats');
  try{
    const wasi=new Proxy({},{get:()=>()=>0});  // 界面代码不用文件和时钟，WASI 给空实现即可
    const [{instance},font]=await Promise.all([
      WebAssembly.instantiateStreaming(fetch('device.wasm'),{wasi_snapshot_preview1:wasi}),
      fetch('font_noto_sans_common_20_4.bin').then(r=>r.ok?r.arrayBuffer():null),
    ]);
    const e=instance.exports;
    e._initialize&&e._initialize();
    if(font){
      const p=e.sim_font_buffer(font.byteLength);
      new Uint8Array(e.memory.buffer,p,font.byteLength).set(new Uint8Array(font));
    }
    const t0=performance.now();
    e.sim_init(0);

    const cv=document.getElementById('lcd'),ctx=cv.getContext('2d');
    const W=480,H=320,img=ctx.createImageData(W,H),px=new Uint32Array(img.data.buffer);

    // 鼠标 / 触屏 → 设备坐标
    const point=(ev,down)=>{
      const r=cv.getBoundingClientRect();
      const x=Math.round((ev.clientX-r.left)/r.width*W),y=Math.round((ev.clientY-r.top)/r.height*H);
      e.sim_pointer(Math.max(0,Math.min(W-1,x)),Math.max(0,Math.min(H-1,y)),down);
    };
    let down=false;
    cv.addEventListener('pointerdown',ev=>{down=true;cv.setPointerCapture(ev.pointerId);point(ev,1)});
    cv.addEventListener('pointermove',ev=>point(ev,down?1:0));
    // 浏览器有时不给 pointerup（拖出窗口、被当成手势取消等），一律当作松手，否则页面会停在半路
    const release=ev=>{if(!down)return;down=false;point(ev,0)};
    cv.addEventListener('pointerup',release);
    cv.addEventListener('pointercancel',release);
    cv.addEventListener('lostpointercapture',release);
    cv.addEventListener('contextmenu',ev=>ev.preventDefault());
    // BOOT 键：按下 / 松开分开传，支持按住说话
    const boot=document.getElementById('boot');
    boot.addEventListener('pointerdown',()=>e.sim_boot_down());
    boot.addEventListener('pointerup',()=>e.sim_boot_up());
    boot.addEventListener('pointerleave',()=>e.sim_boot_up());
    addEventListener('keydown',ev=>{
      if(ev.code==='Space'){ev.preventDefault();if(!ev.repeat)e.sim_boot_down()}
      if(ev.code==='KeyZ')e.sim_force_sleep();  // 不用干等调暗时间
    });
    addEventListener('keyup',ev=>{if(ev.code==='Space')e.sim_boot_up()});

    let frames=0,area=0;
    const loop=()=>{
      area+=e.sim_frame(Math.round(performance.now()-t0))/(W*H);frames++;
      const x0=e.sim_dirty_x0(),y0=e.sim_dirty_y0(),x1=e.sim_dirty_x1(),y1=e.sim_dirty_y1();
      if(x1>x0&&y1>y0){
        const lcd=new Uint16Array(e.memory.buffer,e.sim_lcd(),W*H);
        for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){
          const c=lcd[y*W+x];
          px[y*W+x]=0xff000000|((c&31)<<19)|((((c>>5)&63)<<2)<<8)|((c>>11)<<3);
        }
        ctx.putImageData(img,0,0,x0,y0,x1-x0,y1-y0);
        e.sim_clear_dirty();
      }
      cv.style.filter=`brightness(${Math.max(e.sim_brightness(),0)/100})`;  // 背光，息屏时为 0
      if(frames%30===0){
        stats.textContent=`音量 ${e.sim_volume()}　亮度 ${e.sim_brightness()}　平均每帧刷新 ${(area/frames*100).toFixed(1)}% 屏幕`;
      }
      requestAnimationFrame(loop);
    };
    loop();
  }catch(err){
    stats.textContent='加载失败：'+err+'。需要先运行 python build.py，再用 python -m http.server 打开。';
  }
})();
</script>
</body>
</html>
